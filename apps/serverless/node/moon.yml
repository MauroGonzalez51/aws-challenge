project:
    title: api
    description: serverless app with nodejs and dynamodb

id: serverless-node

tasks:
    pnpm:
        command: pnpm
        args:
            - --filter
            - "@aws-challenge/apps-serverless-node"
        options:
            cache: false
            runFromWorkspaceRoot: true

    serverless:
        command: serverless
        preset: server
        options:
            cache: false
