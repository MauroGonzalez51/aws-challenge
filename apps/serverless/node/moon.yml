project:
    title: api
    description: serverless app with nodejs and dynamodb

id: serverless-node

tasks:
    pnpm:
        command: pnpm
        args:
            - --filter
            - "@aws-challenge/apps-serverless-node"
        options:
            cache: false
            runFromWorkspaceRoot: true

    sls:
        command: sls
        preset: server
        options:
            cache: false

    offline:
        command: sls
        args:
            - offline
            - --stage
            - dev
        deps:
            - ~:prepare
        preset: server
        options:
            cache: false

    prepare:
        script: scripts/prepare
        options:
            cache: false
            runFromWorkspaceRoot: false

    stop:
        script: scripts/stop
        options:
            cache: false
            runFromWorkspaceRoot: false
