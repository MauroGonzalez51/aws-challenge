project:
    title: users
    description: users service

tasks:
    gradlew:
        command: ./gradlew
        options:
            interactive: true
            runFromWorkspaceRoot: false

    docker-build:
        command: docker
        args:
            - build
            - -f
            - Dockerfile
            - .
        options:
            cache: false
            interactive: true
            runFromWorkspaceRoot: false

    test:
        command: ./gradlew
        args:
            - test
